[project]
name = "sulthan-feast-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sulthan Farizan Fawwaz", email = "farizanfawwaz54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "mysql-connector-python>=26.7.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
sulthan-feast-app = "sulthan_feast_app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
